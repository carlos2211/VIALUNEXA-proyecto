spring.application.name=vialunexa-api

# Render (y Docker) indican el puerto con la variable PORT
server.port=${PORT:8081}

# Commit desplegado: Render entrega RENDER_GIT_COMMIT; en otros entornos se usa GIT_COMMIT
app.commit=${RENDER_GIT_COMMIT:${GIT_COMMIT:local}}

# Orígenes del frontend que pueden llamar a la API (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

# Salud del servicio para Render y Docker: /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
